<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爆速！自動食材在庫プロト</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
    <style>
        #interactive.viewport { position: relative; width: 100%; height: 250px; overflow: hidden; border-radius: 8px; background: #000; margin-bottom: 1rem; }
        #interactive.viewport video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        canvas.drawingBuffer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .stock-list { margin-top: 1.5rem; }
        .scan-success { background-color: #d4edda; color: #155724; padding: 0.5rem; border-radius: 4px; text-align: center; margin-bottom: 1rem; display: none; }
        .scan-loading { background-color: #fff3cd; color: #856404; padding: 0.5rem; border-radius: 4px; text-align: center; margin-bottom: 1rem; display: none; }
    </style>
</head>
<body>
    <main class="container">
        <h2>🛒 自動食材在庫プロト</h2>
        
        <div id="scan-message" class="scan-success"></div>
        <div id="loading-message" class="scan-loading">⏳ 商品情報をインターネットから検索中...</div>

        <div id="interactive" class="viewport"></div>
        
        <div class="grid">
            <button id="btn-scan" onclick="startScanner()">📷 スキャン開始</button>
            <button id="btn-clear" class="secondary" onclick="clearAllData()">⚠️ データ初期化</button>
        </div>

        <section class="stock-list">
            <h3>現在の在庫・購入リスト</h3>
            <table role="grid">
                <thead>
                    <tr>
                        <th>商品名 (バーコード)</th>
                        <th style="width: 100px; text-align: center;">数量</th>
                    </tr>
                </thead>
                <tbody id="stock-table-body">
                    </tbody>
            </table>
        </section>
    </main>

    <script>
        let itemDictionary = JSON.parse(localStorage.getItem('itemDictionary')) || {};
        let currentStock = JSON.parse(localStorage.getItem('currentStock')) || {};

        updateStockTable();

        function startScanner() {
            document.getElementById('btn-scan').disabled = true;
            document.getElementById('btn-scan').innerText = "スキャン中...";

            Quagga.init({
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: document.querySelector('#interactive'),
                    constraints: { facingMode: "environment" },
                },
                decoder: { readers: ["ean_reader", "ean_8_reader"] }
            }, function(err) {
                if (err) {
                    console.error(err);
                    alert("カメラの起動に失敗しました。");
                    resetScanButton();
                    return;
                }
                Quagga.start();
            });
        }

        let isProcessing = false;
        Quagga.onDetected(async function(result) {
            if (isProcessing) return;
            
            const code = result.codeResult.code;
            if (code.length !== 13 && code.length !== 8) return; 

            isProcessing = true;
            Quagga.stop(); 

            if (navigator.vibrate) navigator.vibrate(200);

            // 1. すでにアプリ内の辞書にある場合
            if (itemDictionary[code]) {
                const name = itemDictionary[code];
                currentStock[code] = (currentStock[code] || 0) + 1;
                showScanMessage(`「${name}」を追加しました！`);
                saveAndRefresh();
            } 
            // 2. 初めて読むバーコードの場合（ネットから自動検索）
            else {
                showLoading(true);
                try {
                    // Open Food Facts API を使って検索
                    const response = await fetch(`https://world.openfoodfacts.org/api/v0/product/${code}.json`);
                    const data = await response.json();
                    
                    let productName = "";
                    
                    if (data.status === 1 && data.product) {
                        // 日本語の商品名、または汎用の商品名を取得
                        productName = data.product.product_name_ja || data.product.product_name || "";
                    }

                    showLoading(false);

                    // データベースに見つかった場合
                    if (productName && productName.trim() !== "") {
                        itemDictionary[code] = productName.trim();
                        currentStock[code] = 1;
                        showScanMessage(`自動取得: 「${productName}」を追加しました！`);
                        saveAndRefresh();
                    } 
                    // 見つからなかった場合のバックアップ（手動入力）
                    else {
                        setTimeout(() => {
                            const name = prompt(`ネットの辞書に見つかりませんでした。\n商品名を入力してください:\n(${code})`);
                            if (name && name.trim() !== "") {
                                itemDictionary[code] = name.trim();
                                currentStock[code] = 1;
                                showScanMessage(`新規登録: 「${name}」を追加しました！`);
                                saveAndRefresh();
                            } else {
                                resumeScanning();
                            }
                        }, 500);
                    }
                } catch (error) {
                    console.error(error);
                    showLoading(false);
                    alert("通信エラーが発生しました。");
                    resumeScanning();
                }
            }
        });

        function saveAndRefresh() {
            localStorage.setItem('itemDictionary', JSON.stringify(itemDictionary));
            localStorage.setItem('currentStock', JSON.stringify(currentStock));
            updateStockTable();
            setTimeout(() => { resumeScanning(); }, 1500); // 1.5秒後に自動再開
        }

        function resumeScanning() {
            isProcessing = false;
            startScanner();
        }

        function updateStockTable() {
            const tbody = document.getElementById('stock-table-body');
            tbody.innerHTML = "";
            const codes = Object.keys(currentStock);
            if (codes.length === 0) {
                tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; color:gray;">リストは空です</td></tr>`;
                return;
            }
            codes.forEach(code => {
                const name = itemDictionary[code] || "未登録の商品";
                const count = currentStock[code];
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${name}</strong><br><small style="color:gray;">${code}</small></td>
                    <td style="text-align: center;">
                        <button class="outline" style="padding:2px 10px; margin-right:5px;" onclick="changeCount('${code}', -1)">-</button>
                        <span>${count}</span>
                        <button class="outline" style="padding:2px 10px; margin-left:5px;" onclick="changeCount('${code}', 1)">+</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function changeCount(code, amount) {
            if (currentStock[code]) {
                currentStock[code] += amount;
                if (currentStock[code] <= 0) delete currentStock[code];
                localStorage.setItem('currentStock', JSON.stringify(currentStock));
                updateStockTable();
            }
        }

        function resetScanButton() {
            document.getElementById('btn-scan').disabled = false;
            document.getElementById('btn-scan').innerText = "📷 スキャン開始";
        }

        function showScanMessage(msg) {
            const el = document.getElementById('scan-message');
            el.innerText = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        function showLoading(show) {
            document.getElementById('loading-message').style.display = show ? 'block' : 'none';
        }

        function clearAllData() {
            if (confirm("登録した商品辞書とリストをすべて削除しますか？")) {
                localStorage.clear();
                itemDictionary = {};
                currentStock = {};
                updateStockTable();
                alert("削除しました。");
            }
        }
    </script>
</body>
</html>
