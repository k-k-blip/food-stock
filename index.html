<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>軽量化版！Gemini スマホAIカメラ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        body { padding-top: 1rem; }
        #camera-wrapper { position: relative; width: 100%; height: 250px; overflow: hidden; border-radius: 8px; background: #000; margin-bottom: 1rem; }
        #video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 4px solid #4a90e2; border-radius: 8px; box-sizing: border-box; pointer-events: none; opacity: 0.5; }
        .grid { margin-bottom: 1rem; }
        #canvas-hidden { display: none; }
        .scan-loading { background-color: #fff3cd; color: #856404; padding: 0.5rem; border-radius: 4px; text-align: center; margin-bottom: 1rem; display: none; }
        .scan-success { background-color: #d4edda; color: #155724; padding: 0.5rem; border-radius: 4px; text-align: center; margin-bottom: 1rem; display: none; }
        .key-section { background: #f4f6f8; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <main class="container">
        <h2>🛍️ Gemini スマホAIカメラ</h2>

        <details id="key-details" class="key-section">
            <summary>🔑 最初に入鍵：Gemini APIキー設定</summary>
            <label for="api-key-input">Google AI Studioで取得したキーを入力してください：</label>
            <input type="password" id="api-key-input" placeholder="AIzaSy...">
            <button onclick="saveApiKey()">キーを保存してカメラ起動</button>
        </details>

        <div id="loading-message" class="scan-loading">⏳ Geminiが画像から商品を特定中...</div>
        <div id="scan-message" class="scan-success"></div>

        <div id="camera-wrapper">
            <video id="video" autoplay playsinline></video>
            <div id="overlay"></div>
        </div>
        
        <div class="grid">
            <button id="btn-snap" onclick="captureAndIdentify()" style="background-color: #4a90e2; border: none;">📸 写真を撮ってAI認識</button>
            <button id="btn-clear" class="secondary" onclick="clearAllData()">⚠️ データ初期化</button>
        </div>

        <canvas id="canvas-hidden"></canvas>

        <section class="stock-list">
            <h3>現在の在庫・購入リスト</h3>
            <table role="grid">
                <thead>
                    <tr>
                        <th>商品名</th>
                        <th style="width: 100px; text-align: center;">数量</th>
                    </tr>
                </thead>
                <tbody id="stock-table-body">
                </tbody>
            </table>
        </section>
    </main>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas-hidden');
        let itemDictionary = JSON.parse(localStorage.getItem('itemDictionary_gemini_mobile')) || {};
        let currentStock = JSON.parse(localStorage.getItem('currentStock_gemini_mobile')) || {};

        let geminiApiKey = localStorage.getItem('gemini_api_key') || '';
        if (geminiApiKey) {
            document.getElementById('api-key-input').value = geminiApiKey;
            document.getElementById('key-details').open = false;
            initCamera();
        } else {
            document.getElementById('key-details').open = true;
        }

        updateStockTable();

        function saveApiKey() {
            const key = document.getElementById('api-key-input').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                geminiApiKey = key;
                document.getElementById('key-details').open = false;
                alert("キーを保存しました。カメラを起動します。");
                initCamera();
            }
        }

        function initCamera() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then(stream => { video.srcObject = stream; })
                .catch(err => { alert("カメラの起動に失敗しました。"); console.error(err); });
        }

        async function captureAndIdentify() {
            if (!geminiApiKey) {
                alert("先にGeminiのAPIキーを入力して保存してください。");
                document.getElementById('key-details').open = true;
                return;
            }

            const btnSnap = document.getElementById('btn-snap');
            btnSnap.disabled = true;
            btnSnap.innerText = "認識中...";
            showLoading(true);

            video.pause();
            if (navigator.vibrate) navigator.vibrate(200);

            const context = canvas.getContext('2d');
            
            // 💡【CORS・容量対策】縦横の上限を最大640pxに制限し、AIが処理しやすいサイズに強制圧縮します
            const MAX_WIDTH = 640;
            const MAX_HEIGHT = 640;
            let width = video.videoWidth;
            let height = video.videoHeight;

            if (width > height) {
                if (width > MAX_WIDTH) {
                    height *= MAX_WIDTH / width;
                    width = MAX_WIDTH;
                }
            } else {
                if (height > MAX_HEIGHT) {
                    width *= MAX_HEIGHT / height;
                    height = MAX_HEIGHT;
                }
            }

            canvas.width = width;
            canvas.height = height;
            context.drawImage(video, 0, 0, width, height);

            // 画質を 0.5（適度に荒く）まで落としてデータ量を数分の1にします
            const base64Image = canvas.toDataURL('image/jpeg', 0.5).split(',')[1];

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "この画像に写っている食品または日用品のうち、最も目立っている商品の「一般的な具体的な商品名（例：明治おいしい牛乳、コカコーラ、ポテトチップス うすしお味）」を日本語で1つだけ答えてください。説明や挨拶、『商品名：』などの余計な文字は絶対に含めず、名前の単語のみを最短で出力してください。" },
                                {
                                    inlineData: {
                                        mimeType: "image/jpeg",
                                        data: base64Image
                                    }
                                }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                video.play();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let productName = data.candidates[0].content.parts[0].text.trim();
                    productName = productName.replace(/[\n\r➔」〟『』「。,：*#-]/g, "");

                    if (productName && productName !== "") {
                        itemDictionary[productName] = true;
                        currentStock[productName] = (currentStock[productName] || 0) + 1;
                        showScanMessage(`Gemini認識: 「${productName}」を追加！`);
                        saveAndRefresh();
                    } else {
                        alert("商品を特定できませんでした。もう一度撮影してください。");
                    }
                } else {
                    console.error(data);
                    alert("認識に失敗しました。別の角度から試すか、部屋を明るくしてみてください。");
                }

            } catch (error) {
                console.error(error);
                video.play();
                alert("Geminiとの通信エラーが発生しました。");
            } finally {
                showLoading(false);
                btnSnap.disabled = false;
                btnSnap.innerText = "📸 写真を撮ってAI認識";
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('itemDictionary_gemini_mobile', JSON.stringify(itemDictionary));
            localStorage.setItem('currentStock_gemini_mobile', JSON.stringify(currentStock));
            updateStockTable();
        }

        function updateStockTable() {
            const tbody = document.getElementById('stock-table-body');
            tbody.innerHTML = "";
            const names = Object.keys(currentStock);
            if (names.length === 0) {
                tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; color:gray;">リストは空です</td></tr>`;
                return;
            }
            names.forEach(name => {
                const count = currentStock[name];
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${name}</strong></td>
                    <td style="text-align: center;">
                        <button class="outline" style="padding:2px 10px; margin-right:5px;" onclick="changeCount('${name}', -1)">-</button>
                        <span>${count}</span>
                        <button class="outline" style="padding:2px 10px; margin-left:5px;" onclick="changeCount('${name}', 1)">+</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function changeCount(name, amount) {
            if (currentStock[name]) {
                currentStock[name] += amount;
                if (currentStock[name] <= 0) delete currentStock[name];
                localStorage.setItem('currentStock_gemini_mobile', JSON.stringify(currentStock));
                updateStockTable();
            }
        }

        function showScanMessage(msg) {
            const el = document.getElementById('scan-message');
            el.innerText = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        function showLoading(show) {
            document.getElementById('loading-message').style.display = show ? 'block' : 'none';
        }

        function clearAllData() {
            if (confirm("登録した商品リストとAPIキーをすべて削除しますか？")) {
                localStorage.clear();
                itemDictionary = {};
                currentStock = {};
                geminiApiKey = '';
                document.getElementById('api-key-input').value = '';
                document.getElementById('key-details').open = true;
                updateStockTable();
                alert("削除しました。");
            }
        }
    </script>
</body>
</html>
