<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>診断機能付き！Gemini スマホAIカメラ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        body { padding-top: 1rem; }
        #camera-wrapper { position: relative; width: 100%; height: 250px; overflow: hidden; border-radius: 8px; background: #000; margin-bottom: 1rem; }
        #video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 4px solid #e67e22; border-radius: 8px; box-sizing: border-box; pointer-events: none; opacity: 0.5; }
        .grid { margin-bottom: 1rem; }
        #canvas-hidden { display: none; }
        .scan-loading { background-color: #fff3cd; color: #856404; padding: 0.5rem; border-radius: 4px; text-align: center; margin-bottom: 1rem; display: none; }
        .scan-success { background-color: #d4edda; color: #155724; padding: 0.5rem; border-radius: 4px; text-align: center; margin-bottom: 1rem; display: none; }
        .key-section { background: #f4f6f8; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
        #error-log { background: #fde8e8; color: #9b1c1c; padding: 0.5rem; border-radius: 4px; font-size: 0.8rem; margin-top: 0.5rem; display: none; word-break: break-all; }
    </style>
</head>
<body>
    <main class="container">
        <h2>🛍️ Gemini スマホAIカメラ (診断版)</h2>

        <details id="key-details" class="key-section">
            <summary>🔑 Gemini APIキー設定</summary>
            <label for="api-key-input">Google AI Studioのキー(AIzaSy...):</label>
            <input type="password" id="api-key-input" placeholder="AIzaSy...">
            <button onclick="saveApiKey()">キーを保存してカメラ起動</button>
            <button class="secondary" onclick="testTextApi()" style="margin-top:0.5rem;">🧪 キーの接続テスト(文字のみ)</button>
        </details>

        <div id="loading-message" class="scan-loading">⏳ Geminiが画像から商品を特定中...</div>
        <div id="scan-message" class="scan-success"></div>
        <div id="error-log"></div>

        <div id="camera-wrapper">
            <video id="video" autoplay playsinline></video>
            <div id="overlay"></div>
        </div>
        
        <div class="grid">
            <button id="btn-snap" onclick="captureAndIdentify()" style="background-color: #e67e22; border: none;">📸 写真を撮ってAI認識</button>
            <button id="btn-clear" class="secondary" onclick="clearAllData()">⚠️ データ初期化</button>
        </div>

        <canvas id="canvas-hidden"></canvas>

        <section class="stock-list">
            <h3>現在の在庫・購入リスト</h3>
            <table role="grid">
                <thead>
                    <tr>
                        <th>商品名</th>
                        <th style="width: 100px; text-align: center;">数量</th>
                    </tr>
                </thead>
                <tbody id="stock-table-body">
                </tbody>
            </table>
        </section>
    </main>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas-hidden');
        const errorLog = document.getElementById('error-log');
        let itemDictionary = JSON.parse(localStorage.getItem('itemDictionary_gemini_mobile')) || {};
        let currentStock = JSON.parse(localStorage.getItem('currentStock_gemini_mobile')) || {};

        let geminiApiKey = localStorage.getItem('gemini_api_key') || '';
        if (geminiApiKey) {
            document.getElementById('api-key-input').value = geminiApiKey;
            document.getElementById('key-details').open = false;
            initCamera();
        } else {
            document.getElementById('key-details').open = true;
        }

        updateStockTable();

        function saveApiKey() {
            const key = document.getElementById('api-key-input').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                geminiApiKey = key;
                document.getElementById('key-details').open = false;
                errorLog.style.display = 'none';
                alert("キーを保存しました。カメラを起動します。");
                initCamera();
            }
        }

        function initCamera() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then(stream => { video.srcObject = stream; })
                .catch(err => { alert("カメラ起動失敗。ブラウザの設定でカメラを許可してください。"); console.error(err); });
        }

        // 🧪 テスト機能：カメラを使わず、APIキーが生きているか文字だけで確認する
        async function testTextApi() {
            const key = document.getElementById('api-key-input').value.trim();
            if (!key) { alert("先にキーを入力してください"); return; }
            
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "「通信成功」とだけ返してください" }] }] })
                });
                const data = await response.json();
                if(data.candidates && data.candidates[0].content.parts[0].text) {
                    alert("🎉 キーの接続テスト成功！AIからの返答: " + data.candidates[0].content.parts[0].text.trim());
                } else {
                    showRawError(data);
                }
            } catch(e) {
                alert("通信エラーが発生しました。ログを確認してください。");
                errorLog.innerText = e.toString();
                errorLog.style.display = 'block';
            }
        }

        function showRawError(data) {
            errorLog.innerText = "【Googleからのエラー応答】\n" + JSON.stringify(data, null, 2);
            errorLog.style.display = 'block';
        }

        async function captureAndIdentify() {
            if (!geminiApiKey) { alert("先にAPIキーを設定してください。"); return; }

            const btnSnap = document.getElementById('btn-snap');
            btnSnap.disabled = true;
            btnSnap.innerText = "認識中...";
            showLoading(true);
            errorLog.style.display = 'none';

            video.pause();
            if (navigator.vibrate) navigator.vibrate(200);

            const context = canvas.getContext('2d');
            const MAX_WIDTH = 500; // さらに軽量化
            let width = video.videoWidth || 640;
            let height = video.videoHeight || 480;

            if (width > MAX_WIDTH) {
                height *= MAX_WIDTH / width;
                width = MAX_WIDTH;
            }

            canvas.width = width;
            canvas.height = height;
            context.drawImage(video, 0, 0, width, height);

            const base64Image = canvas.toDataURL('image/jpeg', 0.4).split(',')[1];

            // 万が一画像が真っ白・空っぽだった場合のチェック
            if(!base64Image || base64Image.length < 100) {
                alert("エラー：カメラ画像の取得に失敗しました。ブラウザを変更するか、ページを再読み込みしてください。");
                video.play();
                showLoading(false);
                btnSnap.disabled = false;
                btnSnap.innerText = "📸 写真を撮ってAI認識";
                return;
            }

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiApiKey}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "画像に写っている商品の「具体的な商品名（例：明治おいしい牛乳、ポテトチップス うすしお味）」を日本語で1つだけ答えてください。説明や挨拶は含めず、名前のみを出力してください。" },
                                { inlineData: { mimeType: "image/jpeg", data: base64Image } }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                video.play();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let productName = data.candidates[0].content.parts[0].text.trim();
                    productName = productName.replace(/[\n\r➔」〟『』「。,：*#-]/g, "");

                    if (productName && productName !== "") {
                        itemDictionary[productName] = true;
                        currentStock[productName] = (currentStock[productName] || 0) + 1;
                        showScanMessage(`Gemini認識: 「${productName}」を追加！`);
                        saveAndRefresh();
                    } else {
                        alert("商品を特定できませんでした。別の角度から試してください。");
                    }
                } else {
                    // 💡 エラー内容を画面に生表示させる
                    showRawError(data);
                    alert("Google AI側でエラーが発生しました。画面上の赤いログを確認してください。");
                }

            } catch (error) {
                console.error(error);
                video.play();
                errorLog.innerText = error.toString();
                errorLog.style.display = 'block';
                alert("通信エラーが発生しました。");
            } finally {
                showLoading(false);
                btnSnap.disabled = false;
                btnSnap.innerText = "📸 写真を撮ってAI認識";
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('itemDictionary_gemini_mobile', JSON.stringify(itemDictionary));
            localStorage.setItem('currentStock_gemini_mobile', JSON.stringify(currentStock));
            updateStockTable();
        }

        function updateStockTable() {
            const tbody = document.getElementById('stock-table-body');
            tbody.innerHTML = "";
            const names = Object.keys(currentStock);
            if (names.length === 0) {
                tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; color:gray;">リストは空です</td></tr>`;
                return;
            }
            names.forEach(name => {
                const count = currentStock[name];
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${name}</strong></td>
                    <td style="text-align: center;">
                        <button class="outline" style="padding:2px 10px; margin-right:5px;" onclick="changeCount('${name}', -1)">-</button>
                        <span>${count}</span>
                        <button class="outline" style="padding:2px 10px; margin-left:5px;" onclick="changeCount('${name}', 1)">+</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function changeCount(name, amount) {
            if (currentStock[name]) {
                currentStock[name] += amount;
                if (currentStock[name] <= 0) delete currentStock[name];
                localStorage.setItem('currentStock_gemini_mobile', JSON.stringify(currentStock));
                updateStockTable();
            }
        }

        function showScanMessage(msg) {
            const el = document.getElementById('scan-message');
            el.innerText = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        function showLoading(show) {
            document.getElementById('loading-message').style.display = show ? 'block' : 'none';
        }

        function clearAllData() {
            if (confirm("すべてのデータを初期化しますか？")) {
                localStorage.clear();
                itemDictionary = {};
                currentStock = {};
                geminiApiKey = '';
                document.getElementById('api-key-input').value = '';
                document.getElementById('key-details').open = true;
                errorLog.style.display = 'none';
                updateStockTable();
                alert("削除しました。");
            }
        }
    </script>
</body>
</html>
